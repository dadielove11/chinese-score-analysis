<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>初中语文学情分析</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">离线本地工具</p>
      <h1>初中语文学情分析</h1>
    </div>
    <a class="button ghost" href="{{ url_for('export_xlsx') }}">导出 Excel</a>
  </header>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="flash">{{ messages[-1] }}</div>
    {% endif %}
  {% endwith %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
